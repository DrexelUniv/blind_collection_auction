<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account Page</title>
    <link rel="stylesheet" type="text/css" href="style.css">
<!--    <link rel="icon" type="image/png" href="images/drexel_logo.png">-->
</head>
<body>

<div class="page">
    <div class="logo-container">
        <img src="images/drexel_logo.png" alt="Website logo" class="logo">
    </div>

    <div class="form-container">
        <div class="form-group">
            <label for="username">Username:</label>
            <input id="username" type="text" name="username">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input id="email" type="email" id="email">
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input id="password" type="password" id="password">
        </div>

        <div class="form-group">
            <label for="confirm">Confirm Password:</label>
            <input id="confirm" type="password" id="confirm">
        </div>


        <button type="submit">Create Account</button>

        <p>Already have an account? Login <a href="login.html">here</a></p>

    </div>
</div>

<script src="signup.js"></script>

</body>
</html>
