<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <!-- <link rel="icon" type="image/png" href="images/drexel_logo.png"> -->
</head>
<body>

<div class="page">
    <div class="logo-container">
        <img src="images/drexel_logo.png" alt="Website logo" class="logo">
    </div>

    <div class="form-container">
        <div class="form-group">
            <label for="username">Username:</label>
            <input id="username" type="text" name="username">
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input id="password" type="password" name="password">
        </div>

        <div id="message"></div>

        <button id="submit" type="button">Login</button>

        <p>New to [name]? Create an account <a href="signup.html">here</a></p>
        <br>
        <p>Forgot your password? Reset your password here <a href="reset-password.html">here</a></p>
    </div>

</div>

<script src="login.js"></script>


</body>
</html>
