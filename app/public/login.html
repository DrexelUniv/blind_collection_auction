<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    
<h1>Login</h1>

<form id="loginForm" novalidate>

    <label for="username">Username:</label>
    <input
        type="text"
        id="username"
        name="username"
    >

    <label for="password">Password:</label>
    <input
        type="password"
        id="password"
        name="password"
    >

    <button type="submit">Login</button>

    <p id="errorMessage" role="alert"></p>

</form>

<script src="login.js"></script>

</body>
</html>
